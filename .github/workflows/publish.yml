name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-rc.*"
  # Allow publishing a tag explicitly. Tags pushed by the default GITHUB_TOKEN
  # (e.g. from tag-on-version-merge.yml) do not trigger the `push` event above,
  # so that workflow dispatches this one instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v16.2.9)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Note: For full automation, we've removed the environment approval requirement
    # If you want manual approval, uncomment the next line and configure the "publish" environment in GitHub
    # environment: publish
    permissions:
      contents: write # Required for creating releases
      id-token: write # Required for npm provenance and trusted publishing

    env:
      # The tag being published, from the push ref or the manual dispatch input.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch, check out the tag (not the default branch).
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify git tag matches package version
        run: |
          # Extract version from the tag (v16.0.0-alpha.0 -> 16.0.0-alpha.0)
          GIT_TAG_VERSION="${TAG#v}"

          # Get version from package.json
          PACKAGE_VERSION=$(node -p "require('./packages/cache-handler/package.json').version")

          echo "Git tag version: $GIT_TAG_VERSION"
          echo "Package.json version: $PACKAGE_VERSION"

          # Verify they match
          if [ "$GIT_TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "Git tag: v$GIT_TAG_VERSION"
            echo "package.json: $PACKAGE_VERSION"
            echo "These must match. The git tag is the source of truth."
            exit 1
          fi

          echo "✅ Versions match: $PACKAGE_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Upgrade npm for trusted publishing (OIDC)
        # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
        run: npm install -g npm@latest

      - name: Build packages
        run: pnpm build

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./packages/cache-handler/package.json').version")
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-rc"* ]]; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
          echo "Publishing with tag: $(cat $GITHUB_OUTPUT | grep tag= | cut -d= -f2)"

      - name: Publish to npm (OIDC trusted publishing)
        working-directory: packages/cache-handler
        # No token: authentication uses the workflow's OIDC identity, which must
        # be configured as a trusted publisher for this package on npmjs.com.
        # Provenance is attested automatically.
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }} --provenance

      - name: Verify published
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cache-handler/package.json').version")
          DIST_TAG="${{ steps.dist_tag.outputs.tag }}"
          echo "✅ Published @mrjasonroy/cache-components-cache-handler@$PACKAGE_VERSION"
          echo "📦 npm dist-tag: $DIST_TAG"

          # Poll until the new version is queryable; registry propagation can lag
          # well past a few seconds. The publish step already succeeded, so a slow
          # read must NOT fail the job (that would skip the GitHub Release step).
          for i in $(seq 1 12); do
            if npm view "@mrjasonroy/cache-components-cache-handler@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "✅ Verified on npm (attempt $i)"
              npm view "@mrjasonroy/cache-components-cache-handler@$PACKAGE_VERSION"
              break
            fi
            echo "… not visible yet, retrying ($i/12)"
            sleep 10
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          DIST_TAG="${{ steps.dist_tag.outputs.tag }}"

          # Determine if pre-release
          PRERELEASE_FLAG=""
          TITLE="$TAG"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="$TAG (Alpha)"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="$TAG (Beta)"
          elif [[ "$VERSION" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="$TAG (Release Candidate)"
          fi

          # Generate release notes using GitHub API
          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" \
            --jq '.body')

          # Create release notes with installation instructions + auto-generated notes.
          # The generated notes include a "New Contributors" section that @-mentions
          # first-time contributors; the thank-you below makes the acknowledgement explicit.
          RELEASE_NOTES=$(cat <<EOF
          ## Installation

          \`\`\`bash
          npm install @mrjasonroy/cache-components-cache-handler@$VERSION
          \`\`\`

          **npm dist-tag:** \`$DIST_TAG\`

          ---

          $GENERATED_NOTES

          ---

          💜 Thank you to everyone who contributed to this release!
          EOF
          )

          # Create the release (idempotent: update notes if it already exists, e.g. on re-run)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$RELEASE_NOTES"
            echo "✅ Updated existing GitHub release for $TAG"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$RELEASE_NOTES" \
              $PRERELEASE_FLAG
            echo "✅ Created GitHub release for $TAG"
          fi
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/$TAG"

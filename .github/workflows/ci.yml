name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm biome check --formatter-enabled=true --linter-enabled=false .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: memory
            cache_handler: memory
            service_image: ""
            redis_url: ""

          - backend: redis
            cache_handler: redis
            service_image: redis:7-alpine
            redis_url: redis://localhost:6379

          - backend: valkey
            cache_handler: redis
            service_image: valkey/valkey:7-alpine
            redis_url: redis://localhost:6379

    services:
      cache-service:
        image: ${{ matrix.service_image || 'alpine:latest' }}
        ports:
          - 6379:6379
        options: >-
          ${{ matrix.service_image && contains(matrix.service_image, 'redis') && '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
          ${{ matrix.service_image && contains(matrix.service_image, 'valkey') && '--health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm setup:e2e

      - name: Build e2e app
        env:
          CACHE_HANDLER: ${{ matrix.cache_handler }}
          REDIS_URL: ${{ matrix.redis_url }}
        run: |
          cd apps/e2e-test-app
          pnpm build

      - name: Run e2e tests
        env:
          CACHE_HANDLER: ${{ matrix.cache_handler }}
          REDIS_URL: ${{ matrix.redis_url }}
        run: |
          cd apps/e2e-test-app
          pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.backend }}
          path: apps/e2e-test-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-elasticache:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Exercises the ElastiCache handler against the two things that actually differ from a
    # plain Redis container on a real cluster: in-transit TLS and an auth token. No AWS is
    # needed — a self-signed CA trusted via NODE_EXTRA_CA_CERTS lets the factory's `tls: {}`
    # (default certificate verification) succeed against a local Redis whose cert covers
    # localhost, while `requirepass` stands in for the ElastiCache auth token. The old
    # plaintext container (TLS off, no auth) only proved the switch branch, never TLS/AUTH.
    env:
      ELASTICACHE_AUTH_TOKEN: ci-elasticache-auth-token-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Generate TLS certificates (self-signed CA + server cert, SAN=localhost)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tls"
          cd "$GITHUB_WORKSPACE/.tls"
          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -nodes -key ca.key -sha256 -days 1 \
            -subj "/CN=cache-handler-test-ca" -out ca.crt
          openssl genrsa -out redis.key 2048
          openssl req -new -key redis.key -subj "/CN=localhost" -out redis.csr
          openssl x509 -req -in redis.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 1 -sha256 -out redis.crt \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
          chmod 644 ca.crt ca.key redis.crt redis.key

      - name: Start Redis with TLS + auth token
        run: |
          docker run -d --name redis-tls -p 6379:6379 \
            -v "$GITHUB_WORKSPACE/.tls:/tls:ro" \
            redis:7-alpine \
            redis-server \
              --port 0 \
              --tls-port 6379 \
              --tls-cert-file /tls/redis.crt \
              --tls-key-file /tls/redis.key \
              --tls-ca-cert-file /tls/ca.crt \
              --tls-auth-clients no \
              --requirepass "$ELASTICACHE_AUTH_TOKEN"
          echo "Waiting for Redis (TLS + auth) to accept connections..."
          for i in $(seq 1 30); do
            if docker exec redis-tls redis-cli --tls --cacert /tls/ca.crt \
                -a "$ELASTICACHE_AUTH_TOKEN" ping 2>/dev/null | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs redis-tls; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm setup:e2e

      - name: Build e2e app with ElastiCache handler (TLS + auth)
        env:
          CACHE_HANDLER: elasticache
          ELASTICACHE_ENDPOINT: localhost
          ELASTICACHE_PORT: "6379"
          ELASTICACHE_TLS: "true"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tls/ca.crt
        run: |
          cd apps/e2e-test-app
          pnpm build

      - name: Run e2e tests with ElastiCache handler (TLS + auth)
        env:
          CACHE_HANDLER: elasticache
          ELASTICACHE_ENDPOINT: localhost
          ELASTICACHE_PORT: "6379"
          ELASTICACHE_TLS: "true"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tls/ca.crt
        run: |
          cd apps/e2e-test-app
          pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-elasticache
          path: apps/e2e-test-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  test-summary:
    runs-on: ubuntu-latest
    needs: [e2e-tests, e2e-elasticache]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "E2E Matrix Tests: ${{ needs.e2e-tests.result }}"
          echo "ElastiCache Tests: ${{ needs.e2e-elasticache.result }}"

          E2E_RESULT="${{ needs.e2e-tests.result }}"
          ELASTICACHE_RESULT="${{ needs.e2e-elasticache.result }}"

          # Accept both 'success' and 'skipped' as valid results
          if [[ "$E2E_RESULT" != "success" && "$E2E_RESULT" != "skipped" ]] || \
             [[ "$ELASTICACHE_RESULT" != "success" && "$ELASTICACHE_RESULT" != "skipped" ]]; then
            echo "❌ Some tests failed"
            exit 1
          fi

          echo "✅ All tests passed (memory, redis, valkey, elasticache)!"

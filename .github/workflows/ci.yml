name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm biome check --formatter-enabled=true --linter-enabled=false .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  redis-integration:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # The package's real-Redis suite (src/integration/*.redis.test.ts). It stops, pauses and
    # restarts the server itself, so Redis is a named `docker run` container, not a service.
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7-alpine", "valkey/valkey:8-alpine"]
    env:
      CACHE_TEST_REDIS_URL: redis://localhost:6379
      CACHE_TEST_REDIS_CONTAINER: cache-test-redis

    steps:
      - uses: actions/checkout@v4

      - name: Start ${{ matrix.image }}
        run: |
          docker run -d --name "$CACHE_TEST_REDIS_CONTAINER" -p 6379:6379 "${{ matrix.image }}"
          for _ in $(seq 1 30); do
            if docker exec "$CACHE_TEST_REDIS_CONTAINER" sh -c 'redis-cli ping 2>/dev/null || valkey-cli ping' | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs "$CACHE_TEST_REDIS_CONTAINER"; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Redis integration suite
        run: pnpm --filter @mrjasonroy/cache-components-cache-handler test:redis

      - name: Redis logs
        if: failure()
        run: docker logs "$CACHE_TEST_REDIS_CONTAINER" || true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Every lane is a production build (`next build` + `next start`) wired with `withCache`.
    # The Redis lanes run Redis as a named container (not a service) so the outage spec can stop
    # it, start it only after `next build` to prove the build never needs Redis, and run a second
    # `next start` on 3001 for the cross-instance specs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: memory
            image: ""
            use_cache: memory
            custom_handlers: "0"

          - backend: redis
            image: redis:7-alpine
            use_cache: memory
            custom_handlers: "0"

          # Valkey also covers `useCache: "redis"` (plain "use cache" stored in Redis).
          - backend: valkey
            image: valkey/valkey:8-alpine
            use_cache: redis
            custom_handlers: "0"

          # The escape hatch: withCache({ handlers }) pointing at apps/e2e-test-app/cache/*.mjs.
          - backend: redis-custom-handlers
            image: redis:7-alpine
            use_cache: memory
            custom_handlers: "1"

    env:
      E2E_USE_CACHE: ${{ matrix.use_cache }}
      E2E_CUSTOM_HANDLERS: ${{ matrix.custom_handlers }}
      E2E_FLUSH_TOKEN: ci-e2e-flush-token

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm setup:e2e

      # Only the Redis lanes get REDIS_URL at all; the memory lane must see it unset, not empty.
      - name: Configure Redis lane
        if: matrix.image != ''
        run: |
          echo "REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"
          echo "E2E_REDIS_CONTAINER=cache-redis" >> "$GITHUB_ENV"

      # Custom handler files own their ioredis client, which connects as soon as it is created,
      # so that lane gets Redis before the build. The built-in handlers must not touch Redis
      # during `next build`; the other lanes build with REDIS_URL set and nothing listening.
      - name: Start ${{ matrix.image }} (before build)
        if: matrix.image != '' && matrix.custom_handlers == '1'
        run: |
          docker run -d --name "$E2E_REDIS_CONTAINER" -p 6379:6379 "${{ matrix.image }}"
          for _ in $(seq 1 30); do
            if docker exec "$E2E_REDIS_CONTAINER" sh -c 'redis-cli ping 2>/dev/null || valkey-cli ping' | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs "$E2E_REDIS_CONTAINER"; exit 1

      - name: Build e2e app
        run: |
          cd apps/e2e-test-app
          pnpm build

      - name: Start ${{ matrix.image }} (after build)
        if: matrix.image != '' && matrix.custom_handlers != '1'
        run: |
          docker run -d --name "$E2E_REDIS_CONTAINER" -p 6379:6379 "${{ matrix.image }}"
          for _ in $(seq 1 30); do
            if docker exec "$E2E_REDIS_CONTAINER" sh -c 'redis-cli ping 2>/dev/null || valkey-cli ping' | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs "$E2E_REDIS_CONTAINER"; exit 1

      - name: Run e2e tests
        run: |
          cd apps/e2e-test-app
          pnpm test:e2e

      # Last, because it stops Redis under both instances. playwright.config.ts selects only
      # the @outage spec when E2E_OUTAGE=1.
      - name: Run Redis outage e2e test
        if: matrix.image != ''
        env:
          E2E_OUTAGE: "1"
        run: |
          cd apps/e2e-test-app
          pnpm test:e2e

      - name: Redis logs
        if: failure() && matrix.image != ''
        run: docker logs "$E2E_REDIS_CONTAINER" || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.backend }}
          path: apps/e2e-test-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-elasticache:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Exercises the ElastiCache handler against the two things that actually differ from a
    # plain Redis container on a real cluster: in-transit TLS and an auth token. No AWS is
    # needed — a self-signed CA trusted via NODE_EXTRA_CA_CERTS lets the factory's `tls: {}`
    # (default certificate verification) succeed against a local Redis whose cert covers
    # localhost, while `requirepass` stands in for the ElastiCache auth token. The old
    # plaintext container (TLS off, no auth) only proved the switch branch, never TLS/AUTH.
    env:
      ELASTICACHE_AUTH_TOKEN: ci-elasticache-auth-token-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Generate TLS certificates (self-signed CA + server cert, SAN=localhost)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tls"
          cd "$GITHUB_WORKSPACE/.tls"
          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -nodes -key ca.key -sha256 -days 1 \
            -subj "/CN=cache-handler-test-ca" -out ca.crt
          openssl genrsa -out redis.key 2048
          openssl req -new -key redis.key -subj "/CN=localhost" -out redis.csr
          openssl x509 -req -in redis.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 1 -sha256 -out redis.crt \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
          chmod 644 ca.crt ca.key redis.crt redis.key

      - name: Start Redis with TLS + auth token
        run: |
          docker run -d --name redis-tls -p 6379:6379 \
            -v "$GITHUB_WORKSPACE/.tls:/tls:ro" \
            redis:7-alpine \
            redis-server \
              --port 0 \
              --tls-port 6379 \
              --tls-cert-file /tls/redis.crt \
              --tls-key-file /tls/redis.key \
              --tls-ca-cert-file /tls/ca.crt \
              --tls-auth-clients no \
              --requirepass "$ELASTICACHE_AUTH_TOKEN"
          echo "Waiting for Redis (TLS + auth) to accept connections..."
          for _ in $(seq 1 30); do
            if docker exec redis-tls redis-cli --tls --cacert /tls/ca.crt \
                -a "$ELASTICACHE_AUTH_TOKEN" ping 2>/dev/null | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs redis-tls; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm setup:e2e

      # withCache picks ElastiCache up from ELASTICACHE_* alone (no REDIS_URL).
      - name: Build e2e app with ElastiCache handler (TLS + auth)
        env:
          ELASTICACHE_ENDPOINT: localhost
          ELASTICACHE_PORT: "6379"
          ELASTICACHE_TLS: "true"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tls/ca.crt
        run: |
          cd apps/e2e-test-app
          pnpm build

      - name: Run e2e tests with ElastiCache handler (TLS + auth)
        env:
          ELASTICACHE_ENDPOINT: localhost
          ELASTICACHE_PORT: "6379"
          ELASTICACHE_TLS: "true"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tls/ca.crt
        run: |
          cd apps/e2e-test-app
          pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-elasticache
          path: apps/e2e-test-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  test-summary:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, e2e-tests, e2e-elasticache, redis-integration]
    if: always()
    steps:
      - name: Check test results
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          ELASTICACHE_RESULT: ${{ needs.e2e-elasticache.result }}
          REDIS_INTEGRATION_RESULT: ${{ needs.redis-integration.result }}
        run: |
          echo "Lint and typecheck: $LINT_RESULT"
          echo "Unit Tests: $UNIT_RESULT"
          echo "E2E Matrix Tests: $E2E_RESULT"
          echo "ElastiCache Tests: $ELASTICACHE_RESULT"
          echo "Redis Integration: $REDIS_INTEGRATION_RESULT"

          # Every job must succeed. No job has an `if:` of its own, so a skipped job means a job
          # it needs failed or was cancelled: skipped is a failure here, not a pass.
          for result in "$LINT_RESULT" "$UNIT_RESULT" "$E2E_RESULT" "$ELASTICACHE_RESULT" "$REDIS_INTEGRATION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "❌ Some checks failed, were cancelled or were skipped"
              exit 1
            fi
          done

          echo "✅ All tests passed (memory, redis, valkey, custom handlers, elasticache, redis integration)!"

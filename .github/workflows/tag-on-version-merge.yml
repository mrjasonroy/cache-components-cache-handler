name: Create Tag on Version Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag:
    # Trigger on version-bump/ branches (manual bumps) or nextjs- branches (automated updates)
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'version-bump/') || startsWith(github.event.pull_request.head.ref, 'nextjs-'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cache-handler/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from package.json: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          if [ "${{ steps.tag_check.outputs.exists }}" = "true" ]; then
            echo "⚠️ Tag v${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "✅ Tag v${{ steps.version.outputs.version }} created and pushed"
            echo ""
            echo "The publish workflow will be triggered automatically."
            echo "Watch: https://github.com/${{ github.repository }}/actions/workflows/publish.yml"
          fi

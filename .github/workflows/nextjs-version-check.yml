name: Next.js Version Check

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  # Fails (and emails the owner) when a tagged release never reached npm, so a
  # broken publish chain can't go unnoticed behind an already-merged PR again.
  npm-publish-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare repo version with npm
        run: |
          PKG=$(node -p "require('./packages/cache-handler/package.json').name")
          REPO=$(node -p "require('./packages/cache-handler/package.json').version")
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$REPO" >/dev/null; then
            echo "v$REPO is not tagged yet; nothing to check"
            exit 0
          fi
          if npm view "$PKG@$REPO" version >/dev/null 2>&1; then
            echo "✅ $PKG@$REPO is on npm"
          else
            echo "::error::v$REPO is tagged but $PKG@$REPO is not on npm (latest: $(npm view "$PKG" version)). Run: gh workflow run publish.yml -f tag=v$REPO"
            exit 1
          fi

  check-nextjs-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      needs_update: ${{ steps.check_version.outputs.needs_update }}
      latest_version: ${{ steps.check_version.outputs.latest_version }}
      is_major_minor_bump: ${{ steps.check_version.outputs.is_major_minor_bump }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the release PAT so the branch push + PR are authored by a real
          # identity. A PR opened by GITHUB_TOKEN does NOT trigger CI (ci.yml's
          # required checks never run) and a bot-merge does NOT fire the post-merge
          # tag/publish chain — both are GitHub's anti-recursion rule. Falls back to
          # GITHUB_TOKEN when RELEASE_PAT is unset (PR opens, but you merge by hand).
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check for new Next.js version
        id: check_version
        run: |
          # Get current Next.js version from e2e-test-app (what we're testing against)
          # Strip semver range prefix (^, ~, >=, etc.) to get bare version for comparison
          CURRENT_NEXTJS=$(node -p "require('./apps/e2e-test-app/package.json').dependencies.next.replace(/^[^0-9]*/, '')")
          echo "Current Next.js in e2e-test-app: $CURRENT_NEXTJS"

          # Get current package version
          CURRENT_PKG_VERSION=$(node -p "require('./packages/cache-handler/package.json').version")
          echo "Current package version: $CURRENT_PKG_VERSION"

          # Get latest Next.js version from npm
          LATEST_VERSION=$(npm view next version)
          echo "Latest Next.js version: $LATEST_VERSION"

          # Extract major.minor from versions
          CURRENT_MAJOR_MINOR=$(echo $CURRENT_PKG_VERSION | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          LATEST_MAJOR_MINOR=$(echo $LATEST_VERSION | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')

          echo "current_nextjs=$CURRENT_NEXTJS" >> $GITHUB_OUTPUT
          echo "current_pkg_version=$CURRENT_PKG_VERSION" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current_major_minor=$CURRENT_MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "latest_major_minor=$LATEST_MAJOR_MINOR" >> $GITHUB_OUTPUT

          # Check if major.minor changed (triggers package version bump)
          if [ "$CURRENT_MAJOR_MINOR" != "$LATEST_MAJOR_MINOR" ]; then
            echo "is_major_minor_bump=true" >> $GITHUB_OUTPUT
            echo "New major.minor: $LATEST_MAJOR_MINOR"
          else
            echo "is_major_minor_bump=false" >> $GITHUB_OUTPUT
          fi

          # Check if we need any update (patch or major.minor)
          if [ "$CURRENT_NEXTJS" != "$LATEST_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT_NEXTJS -> $LATEST_VERSION"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already on latest: $LATEST_VERSION"
          fi

      - name: Check if branch already exists
        if: steps.check_version.outputs.needs_update == 'true'
        id: branch_check
        run: |
          BRANCH_NAME="nextjs-${{ steps.check_version.outputs.latest_version }}"
          if git ls-remote --heads origin $BRANCH_NAME | grep -q $BRANCH_NAME; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
            echo "Branch $BRANCH_NAME already exists"
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

      # A bump PR that already exists is not rebuilt, so without this check a PR
      # with red CI would be skipped silently every night. Fail the run instead
      # (GitHub emails the owner) until someone fixes or closes it.
      - name: Check the existing bump PR
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="nextjs-${{ steps.check_version.outputs.latest_version }}"
          PR=$(gh pr list --head "$BRANCH" --state open --json number,url --jq '.[0]')
          if [ -z "$PR" ]; then
            echo "::error::Branch $BRANCH exists but has no open PR, so Next.js ${{ steps.check_version.outputs.latest_version }} will never ship. Delete the branch to let the next run recreate it: git push origin --delete $BRANCH"
            exit 1
          fi
          URL=$(echo "$PR" | jq -r .url)
          FAILED=$(gh pr checks "$BRANCH" --json name,bucket --jq '[.[] | select(.bucket == "fail") | .name] | join(", ")' || true)
          if [ -n "$FAILED" ]; then
            echo "::error::Bump PR $URL has failing checks ($FAILED). It will not auto-merge until they pass."
            exit 1
          fi
          echo "Bump PR $URL is open and has no failing checks; waiting for it to merge."

      - name: Create feature branch
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b nextjs-${{ steps.check_version.outputs.latest_version }}

      - name: Update Next.js version
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          # Update e2e-test-app
          cd apps/e2e-test-app
          pnpm add next@${{ steps.check_version.outputs.latest_version }}
          cd ../..

          # Update redis-example
          cd apps/redis-example
          pnpm add next@${{ steps.check_version.outputs.latest_version }}
          cd ../..

          # Bump package version to match Next.js version, but never lower it: the
          # package can ship its own release ahead of Next (e.g. 16.5.0 while Next
          # is on 16.4.x), and publishing a lower version would move npm `latest` back.
          NEW_PKG_VERSION="${{ steps.check_version.outputs.latest_version }}"
          CURRENT_PKG_VERSION="${{ steps.check_version.outputs.current_pkg_version }}"
          if ! node -e 'const p=v=>{const[m,pre]=v.split("-");return[...m.split(".").map(Number),pre?0:1]};const[a,b]=process.argv.slice(1).map(p);for(let i=0;i<4;i++){if(a[i]!==b[i])process.exit(a[i]>b[i]?0:1)}process.exit(1)' "$CURRENT_PKG_VERSION" "$NEW_PKG_VERSION"; then
            cd packages/cache-handler
            npm version $NEW_PKG_VERSION --no-git-tag-version --allow-same-version
            cd ../..
            echo "Bumped package version to $NEW_PKG_VERSION"
          else
            echo "Package is already at $CURRENT_PKG_VERSION (ahead of Next $NEW_PKG_VERSION); not bumping"
          fi

      - name: Install updated dependencies
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: pnpm install

      - name: Run formatting
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: pnpm format

      - name: Run linting
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: pnpm lint
        continue-on-error: true

      - name: Run type checking
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: pnpm typecheck
        continue-on-error: true

      - name: Build packages
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: pnpm build

      - name: Install Playwright browsers
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          cd apps/e2e-test-app
          pnpm exec playwright install chromium

      - name: Run e2e tests with memory cache
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          cd apps/e2e-test-app
          pnpm build
          pnpm test:e2e
        continue-on-error: true
        id: test_memory

      - name: Run e2e tests with Redis
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          # The Redis service container starts empty, so there is nothing to flush.
          # (redis-cli is not installed on the runner; calling it exited 127 and
          # marked every bump PR "Tests need review".)
          cd apps/e2e-test-app
          REDIS_URL=redis://localhost:6379 pnpm build
          REDIS_URL=redis://localhost:6379 pnpm test:e2e
        continue-on-error: true
        id: test_redis

      - name: Commit changes
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          git add .
          git commit -m "chore: update to Next.js ${{ steps.check_version.outputs.latest_version }}

          - Updated Next.js to ${{ steps.check_version.outputs.latest_version }}
          - Bumped package version to ${{ steps.check_version.outputs.latest_version }}
          - Memory tests: ${{ steps.test_memory.outcome }}
          - Redis tests: ${{ steps.test_redis.outcome }}

          Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"

      - name: Push changes
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        run: |
          git push origin nextjs-${{ steps.check_version.outputs.latest_version }}

      - name: Create Pull Request
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        id: create_pr
        env:
          # PAT so the PR triggers ci.yml (the required checks that gate the merge).
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          MEMORY_STATUS="${{ steps.test_memory.outcome }}"
          REDIS_STATUS="${{ steps.test_redis.outcome }}"

          if [ "$MEMORY_STATUS" = "success" ] && [ "$REDIS_STATUS" = "success" ]; then
            PR_TITLE="✅ Next.js ${{ steps.check_version.outputs.latest_version }} - All tests passing"
            ALL_TESTS_PASSED="true"
          else
            PR_TITLE="⚠️ Next.js ${{ steps.check_version.outputs.latest_version }} - Tests need review"
            ALL_TESTS_PASSED="false"
          fi

          PR_BODY=$(cat <<EOF
          ## Next.js ${{ steps.check_version.outputs.latest_version }} Release

          📦 Package version will be bumped to **${{ steps.check_version.outputs.latest_version }}**

          ### Changes
          - ⬆️ Updated Next.js from ${{ steps.check_version.outputs.current_nextjs }} to ${{ steps.check_version.outputs.latest_version }}

          ### Test Results
          - $([ "$MEMORY_STATUS" = "success" ] && echo "✅" || echo "❌") Memory cache tests: $MEMORY_STATUS
          - $([ "$REDIS_STATUS" = "success" ] && echo "✅" || echo "❌") Redis cache tests: $REDIS_STATUS

          ---
          *Auto-generated by [nextjs-version-check workflow](https://github.com/${{ github.repository }}/actions/workflows/nextjs-version-check.yml)*
          EOF
          )

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head nextjs-${{ steps.check_version.outputs.latest_version }})

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "all_tests_passed=$ALL_TESTS_PASSED" >> $GITHUB_OUTPUT

      - name: Enable auto-merge
        if: steps.check_version.outputs.needs_update == 'true' && steps.branch_check.outputs.branch_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          BRANCH="nextjs-${{ steps.check_version.outputs.latest_version }}"

          # No agent, no human: the PR ships itself once the required checks pass
          # (lint-and-typecheck, unit-tests, and test-summary — which is green only if
          # the full e2e matrix passes: memory, redis, valkey, elasticache). The e2e
          # suite IS the reviewer.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_PAT not set — PR opened, but auto-merge is off."
            echo "Add a RELEASE_PAT secret (Contents + Pull requests: write) for"
            echo "hands-off releases, or merge $BRANCH yourself once CI is green."
            echo "See docs/auto-release.md."
            exit 0
          fi

          # Auto-merge must be enabled by the PAT (a real identity): a merge performed
          # via GITHUB_TOKEN would not fire tag-on-version-merge.yml.
          gh pr merge "$BRANCH" --squash --auto --delete-branch
          echo "🚀 Auto-merge enabled for $BRANCH — it ships the moment CI is green."

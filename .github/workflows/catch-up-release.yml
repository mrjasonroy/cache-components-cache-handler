name: Catch-up Release

# This workflow is for catching up to the latest Next.js version when you've fallen behind.
# It updates the apps to the latest Next.js and the package to the matching version (the next
# patch npm has never seen; see docs/publishing/RELEASE.md), runs tests, and opens an
# auto-merging PR whose merge tags and publishes the release.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        type: boolean
        default: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the release PAT so the catch-up PR triggers CI and its merge fires
          # tag-on-version-merge (a GITHUB_TOKEN-opened PR runs no CI and a bot-merge
          # triggers nothing — GitHub's anti-recursion rule).
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check versions
        id: versions
        run: |
          CURRENT_PKG_VERSION=$(node -p "require('./packages/cache-handler/package.json').version")
          LATEST_NEXTJS=$(npm view next version)
          # Next's version, moved up past any version npm has ever seen (unpublished ones
          # included), and never lower than the current one; empty when no bump is needed.
          NEW_PKG_VERSION=$(node scripts/release-version.mjs target "$LATEST_NEXTJS")

          echo "current_pkg_version=$CURRENT_PKG_VERSION" >> $GITHUB_OUTPUT
          echo "latest_nextjs=$LATEST_NEXTJS" >> $GITHUB_OUTPUT
          echo "new_pkg_version=$NEW_PKG_VERSION" >> $GITHUB_OUTPUT

          echo "📦 Current package version: $CURRENT_PKG_VERSION"
          echo "🔄 Latest Next.js version: $LATEST_NEXTJS"
          echo "🎯 Target package version: ${NEW_PKG_VERSION:-none}"

          if [ -z "$NEW_PKG_VERSION" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Package $CURRENT_PKG_VERSION is not behind Next $LATEST_NEXTJS; nothing to do"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Next.js in apps
        if: steps.versions.outputs.needs_update == 'true'
        run: |
          # Update e2e-test-app
          cd apps/e2e-test-app
          pnpm add next@${{ steps.versions.outputs.latest_nextjs }}
          cd ../..

          # Update redis-example
          cd apps/redis-example
          pnpm add next@${{ steps.versions.outputs.latest_nextjs }}
          cd ../..

          # The package's unit tests run against the Next it supports (a dev dependency)
          cd packages/cache-handler
          pnpm add -D --save-exact next@${{ steps.versions.outputs.latest_nextjs }}
          cd ../..

      - name: Update package version
        if: steps.versions.outputs.needs_update == 'true'
        run: |
          cd packages/cache-handler
          npm version ${{ steps.versions.outputs.new_pkg_version }} --no-git-tag-version --allow-same-version
          cd ../..
          # A new major.minor moves the next peer to ~<major>.<minor>.0; CHANGELOG.md's
          # "## [Unreleased]" becomes the release's section (publish.yml's release notes).
          node scripts/release-version.mjs sync "${{ steps.versions.outputs.current_pkg_version }}"
          # Never let the package's major.minor run ahead of Next's latest stable.
          node scripts/release-version.mjs check

      - name: Install updated dependencies
        if: steps.versions.outputs.needs_update == 'true'
        run: pnpm install

      - name: Run formatting
        if: steps.versions.outputs.needs_update == 'true'
        run: pnpm format

      - name: Run linting
        if: steps.versions.outputs.needs_update == 'true'
        run: pnpm lint

      - name: Run type checking
        if: steps.versions.outputs.needs_update == 'true'
        run: pnpm typecheck

      - name: Build packages
        if: steps.versions.outputs.needs_update == 'true'
        run: pnpm build

      - name: Install Playwright browsers
        if: steps.versions.outputs.needs_update == 'true'
        run: |
          cd apps/e2e-test-app
          pnpm exec playwright install chromium

      - name: Run e2e tests with memory cache
        if: steps.versions.outputs.needs_update == 'true'
        id: test_memory
        run: |
          cd apps/e2e-test-app
          pnpm build
          pnpm test:e2e

      - name: Run e2e tests with Redis
        if: steps.versions.outputs.needs_update == 'true'
        id: test_redis
        run: |
          # The Redis service container starts empty, so there is nothing to flush.
          # (redis-cli is not installed on the runner; calling it exited 127.)
          cd apps/e2e-test-app
          REDIS_URL=redis://localhost:6379 pnpm build
          REDIS_URL=redis://localhost:6379 pnpm test:e2e

      - name: Create branch and commit
        if: steps.versions.outputs.needs_update == 'true' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="catch-up-${{ steps.versions.outputs.new_pkg_version }}"
          git checkout -b $BRANCH_NAME

          git add .
          git commit -m "chore: catch-up release for Next.js ${{ steps.versions.outputs.latest_nextjs }}

          - Updated Next.js to ${{ steps.versions.outputs.latest_nextjs }}
          - Updated package version to ${{ steps.versions.outputs.new_pkg_version }}
          - All tests passing

          Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"

          git push origin $BRANCH_NAME

      - name: Create PR and enable auto-merge
        if: steps.versions.outputs.needs_update == 'true' && inputs.dry_run != true
        env:
          # PAT so the PR triggers CI and the merge fires tag-on-version-merge.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          VERSION="${{ steps.versions.outputs.new_pkg_version }}"
          BRANCH_NAME="catch-up-$VERSION"

          PR_BODY=$(cat <<'EOF'
          ## Catch-up Release for Next.js ${{ steps.versions.outputs.latest_nextjs }}

          This release updates the cache handler to support Next.js ${{ steps.versions.outputs.latest_nextjs }}.

          ### Changes
          - ⬆️ Updated Next.js to ${{ steps.versions.outputs.latest_nextjs }}
          - 📦 Bumped package version to ${{ steps.versions.outputs.new_pkg_version }}

          ### Test Results
          - ✅ Memory cache tests: PASSED
          - ✅ Redis cache tests: PASSED

          ### Automation
          This PR will be auto-merged. After merge:
          1. Git tag `v${{ steps.versions.outputs.new_pkg_version }}` will be created
          2. Package will be published to npm

          ---
          *Auto-generated by catch-up-release workflow*
          EOF
          )

          gh pr create \
            --title "✅ Catch-up: Next.js ${{ steps.versions.outputs.latest_nextjs }} (v$VERSION)" \
            --body "$PR_BODY" \
            --base main \
            --head $BRANCH_NAME

          # Enable auto-merge
          gh pr merge $BRANCH_NAME --auto --squash --delete-branch

          echo "✅ Created PR and enabled auto-merge"
          echo "🔗 PR will be merged automatically once status checks pass"

      - name: Summary
        run: |
          if [ "${{ steps.versions.outputs.needs_update }}" != "true" ]; then
            echo "✅ Already up to date with Next.js ${{ steps.versions.outputs.latest_nextjs }}"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🧪 DRY RUN - Would have published:"
            echo "   - Package version: ${{ steps.versions.outputs.new_pkg_version }}"
            echo "   - Next.js version: ${{ steps.versions.outputs.latest_nextjs }}"
          else
            echo "✅ Created PR for @mrjasonroy/cache-components-cache-handler@${{ steps.versions.outputs.new_pkg_version }}"
            echo "📋 PR will auto-merge after status checks pass"
            echo "📦 After merge, package will be published to npm automatically"
          fi
